<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="topArc" d="M 60,205 A 140,140 0 0 1 340,205" fill="none"/>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#B03A2E"/>
    </radialGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="200" cy="200" r="192" fill="#F4D03F"/>
  <circle cx="200" cy="200" r="176" fill="url(#bgGrad)"/>

  <!-- circuit trace pattern on outer gold ring -->
  <g stroke="#B8860B" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M 200,10 L 200,26 M 200,26 L 214,26 L 214,36"/>
    <circle cx="214" cy="36" r="3" fill="#B8860B" stroke="none"/>
    <path d="M 46,120 L 60,128 M 60,128 L 60,142"/>
    <circle cx="60" cy="142" r="3" fill="#B8860B" stroke="none"/>
    <path d="M 354,120 L 340,128 M 340,128 L 340,142"/>
    <circle cx="340" cy="142" r="3" fill="#B8860B" stroke="none"/>
    <path d="M 46,280 L 60,272 M 60,272 L 60,258"/>
    <circle cx="60" cy="258" r="3" fill="#B8860B" stroke="none"/>
    <path d="M 354,280 L 340,272 M 340,272 L 340,258"/>
    <circle cx="340" cy="258" r="3" fill="#B8860B" stroke="none"/>
    <path d="M 200,390 L 200,374 M 200,374 L 186,374 L 186,364"/>
    <circle cx="186" cy="364" r="3" fill="#B8860B" stroke="none"/>
  </g>

  <circle cx="200" cy="200" r="176" fill="none" stroke="#F4D03F" stroke-width="4"/>

  <!-- browser window dots (nod to web dev) -->
  <circle cx="176" cy="66" r="6" fill="#E74C3C" stroke="#F4D03F" stroke-width="1.5"/>
  <circle cx="200" cy="63" r="6" fill="#F4D03F" stroke="#F4D03F" stroke-width="1.5"/>
  <circle cx="224" cy="66" r="6" fill="#8FBF6A" stroke="#F4D03F" stroke-width="1.5"/>

  <!-- curved top text -->
  <text font-family="Arial Black, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="2" fill="#F4D03F">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">LOS POLLOS HERMANOS</textPath>
  </text>

  <!-- code tags flanking the rooster -->
  <text x="66" y="240" font-family="Consolas, Menlo, monospace" font-size="46" font-weight="700" fill="#F4D03F" opacity="0.9">&lt;</text>
  <text x="316" y="240" font-family="Consolas, Menlo, monospace" font-size="46" font-weight="700" fill="#F4D03F" opacity="0.9" text-anchor="end">/&gt;</text>

  <!-- rooster silhouette -->
  <g transform="translate(200,236)">
    <!-- tail feathers -->
    <path d="M -18,-15 C -70,-60 -85,-110 -55,-150 C -60,-105 -45,-75 -18,-50 Z" fill="#F4D03F"/>
    <path d="M -6,-20 C -45,-80 -48,-130 -10,-160 C -25,-115 -15,-80 4,-48 Z" fill="#FDF2CC"/>
    <path d="M 8,-22 C -10,-85 5,-135 45,-155 C 20,-115 22,-78 26,-46 Z" fill="#F4D03F"/>

    <!-- body -->
    <ellipse cx="10" cy="10" rx="54" ry="42" fill="#FDF2CC"/>

    <!-- wing -->
    <path d="M -18,-4 C 8,-6 30,9 23,34 C 1,30 -20,18 -18,-4 Z" fill="#E9C46A"/>

    <!-- neck + head -->
    <path d="M 38,-28 C 56,-42 70,-64 64,-88 C 84,-72 84,-42 62,-22 Z" fill="#FDF2CC"/>
    <circle cx="72" cy="-72" r="24" fill="#FDF2CC"/>

    <!-- comb -->
    <path d="M 58,-90 C 62,-103 71,-105 73,-96 C 77,-107 86,-107 86,-96 C 92,-105 101,-100 95,-89 C 86,-93 75,-93 66,-85 Z" fill="#E74C3C"/>

    <!-- beak -->
    <path d="M 93,-72 L 109,-67 L 93,-60 Z" fill="#F4D03F"/>
    <!-- wattle -->
    <path d="M 86,-58 C 90,-49 86,-43 80,-45 C 78,-52 80,-58 86,-58 Z" fill="#E74C3C"/>
    <!-- eye -->
    <circle cx="78" cy="-76" r="4" fill="#2C2C2C"/>

    <!-- legs -->
    <path d="M -4,48 L -8,68 M -4,48 L -13,64 M -4,48 L 1,66" stroke="#F4D03F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 28,48 L 24,68 M 28,48 L 19,64 M 28,48 L 35,66" stroke="#F4D03F" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- bottom text, monospace "code" style -->
  <text x="192" y="352" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="700" letter-spacing="4" fill="#F4D03F" text-anchor="middle">LOGIC<tspan opacity="0.85">_</tspan></text>
  <line x1="104" y1="364" x2="296" y2="364" stroke="#F4D03F" stroke-width="3"/>
</svg>
