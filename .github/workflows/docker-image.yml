name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_PASS }}
        run: |
          docker login -u $DOCKER_USER -p $DOCKER_PASS

      # IMPORTANTE: el contexto de build es la carpeta JeWeblryStore,
      # porque es ahí donde vive el proyecto Laravel y el Dockerfile.
      - name: Build the Docker image
        run: |
          docker build ./JeWeblryStore \
            --file ./JeWeblryStore/Dockerfile \
            --tag ${{ secrets.DOCKERHUB_USER }}/jeweblrystore:latest

      - name: Docker Push
        run: docker push ${{ secrets.DOCKERHUB_USER }}/jeweblrystore:latest
